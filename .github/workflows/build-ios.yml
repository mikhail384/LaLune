# .github/workflows/build-ios.yml
#
# Сборка LaLune под iOS (Flutter native + Swift backend + CSQTT / CSQTTR).

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Stable release version in X.Y.Z format, e.g. 0.9.4 (empty uses STABLE-shortsha)'
        required: false
        type: string
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

# No `cancel-in-progress`: every observed iOS run was cancelled ~10 seconds in,
# while the macOS job was still queued with no runner assigned. Cancelling an
# in-flight IPA build on the next push only produces red runs and no artifact.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep a single Flutter version across all workflows: the app code and
  # pubspec are shared, and a mismatch produces different Dart SDKs for the
  # same source tree.
  FLUTTER_VERSION: "3.47.5"
  XCODE_APP: /Applications/Xcode_15.4.app
  CSQTT_IOS_CORE_URL: https://github.com/Endlad2/csqtt-core/releases/latest/download/libcsqtt_ios_core.a
  CSQTTR_IOS_CORE_URL: https://github.com/Endlad2/csqttr-core/releases/latest/download/libcsqttr_ios_core.a

jobs:
  prepare-version:
    name: Prepare version before iOS build
    runs-on: ubuntu-latest
    outputs:
      build_ref: ${{ steps.prepare.outputs.build_ref }}
      version: ${{ steps.prepare.outputs.version }}
      manual_stable: ${{ steps.prepare.outputs.manual_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp, commit and push manual version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.stable_version }}" ]]; then
            VERSION="${{ inputs.stable_version }}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable version must be exactly X.Y.Z, for example 0.9.4." >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
              echo "Manual version stamping must be dispatched from a branch, not ${GITHUB_REF_TYPE}." >&2
              exit 1
            fi

            BRANCH="${GITHUB_REF_NAME}"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            python .github/scripts/stamp_version.py "$VERSION"
            git diff --check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --allow-empty -m "chore: sync LaLune version to $VERSION [skip ci]"
            git push origin "HEAD:$BRANCH"

            BUILD_REF="$(git rev-parse HEAD)"
            MANUAL_STABLE=true
          else
            STABLE_VERSION="$(tr -d '\r\n' < STABLE)"
            VERSION="${STABLE_VERSION}-$(git rev-parse --short=7 HEAD)"
            BUILD_REF="$(git rev-parse HEAD)"
            MANUAL_STABLE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_ref=$BUILD_REF" >> "$GITHUB_OUTPUT"
          echo "manual_stable=$MANUAL_STABLE" >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build unsigned IPA
    needs: prepare-version
    # `macos-latest` is the label GitHub always keeps provisioned; the pinned
    # `macos-14` label can stay queued (or get cancelled) on accounts without
    # that image. The "Select Xcode" step picks Xcode 15.4 when present and
    # warns instead of failing when only a newer Xcode is installed.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-version.outputs.build_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-version.outputs.version }}"

          # Manual stable runs already build from the committed stamped SHA.
          # For ordinary push/PR/tag builds keep the previous STABLE-shortsha
          # behavior for the iOS backend without committing source changes.
          if [[ "${{ needs.prepare-version.outputs.manual_stable }}" != "true" ]]; then
            python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path('Backend/iOS/Backend.swift')
          source = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'private let VERSION = "[^"]*"',
              f'private let VERSION = "{sys.argv[1]}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not stamp iOS backend version')
          path.write_text(updated, encoding='utf-8')
          PY
          fi

          echo "LALUNE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building iOS version: $VERSION"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          else
            echo "::warning::$XCODE_APP not found; keeping the image default"
            ls -1 /Applications | grep -i '^Xcode' || true
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Copy iOS backend sources
        run: |
          set -e
          mkdir -p Frontend/ios/Runner

          # Единственный список исходников живёт в Frontend/ios/sync-backend.sh:
          # AppDelegate.swift и SceneDelegate.swift в Runner — авторитетные,
          # остальное копируется из Backend/iOS.
          sh Frontend/ios/sync-backend.sh

          for required in TunnelSession.swift TunnelSocks5Server.swift TcpStack.swift \
                          UdpNat.swift PacketPump.swift IncyConfig.swift \
                          CallKeepAlive.swift LaLuneCoreBridge.h; do
            if [ ! -f "Frontend/ios/Runner/$required" ]; then
              echo "::error::$required missing"
              exit 1
            fi
          done

          # NetworkExtension больше не используется: системный VPN — incy.
          rm -rf Frontend/ios/Tunnel

      - name: Copy assets
        run: |
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Check flutter build subcommands
        working-directory: Frontend
        continue-on-error: true
        run: |
          flutter build --help || true
          flutter build ios-framework --help || true

      - name: Build Flutter iOS frameworks
        shell: bash
        working-directory: Frontend
        run: |
          set -euo pipefail
          # Duplicate every line of the tool output as an ::error:: annotation:
          # job logs need admin rights on this repository, annotations do not,
          # so this is the only way a failure here is diagnosable.
          report() {
            tail -n 60 build-frameworks.log | sed 's/\r$//' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          }

          if flutter build ios-framework --output=ios/Flutter --release --no-codesign \
               > build-frameworks.log 2>&1; then
            echo "flutter build ios-framework (--no-codesign) OK"
          elif flutter build ios-framework --output=ios/Flutter --release \
                 > build-frameworks.log 2>&1; then
            echo "flutter build ios-framework (default codesign) OK"
          else
            echo "::error::flutter build ios-framework failed"
            report
            exit 1
          fi

          tail -n 20 build-frameworks.log || true
          ls -la ios/Flutter/Release/ || true
          if [ ! -d ios/Flutter/Release/Flutter.xcframework ]; then
            echo "::warning::Flutter.xcframework not found under ios/Flutter/Release"
            find ios/Flutter -maxdepth 3 -name '*.xcframework' -print 2>/dev/null || true
          fi

      - name: Download CSQTT iOS core
        run: |
          set -e
          mkdir -p Frontend/ios/Core
          cd Frontend/ios/Core
          curl -fL --retry 3 --retry-delay 2 -o libcsqtt_ios_core.a "$CSQTT_IOS_CORE_URL"
          ls -la libcsqtt_ios_core.a

      - name: Set up Rust for CSQTTR fallback build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Download CSQTTR iOS core
        run: |
          set -e
          mkdir -p Frontend/ios/Core
          if curl -fL --retry 2 --retry-delay 2 -o Frontend/ios/Core/libcsqttr_ios_core.a "$CSQTTR_IOS_CORE_URL"; then
            echo "Downloaded published CSQTTR iOS core"
          else
            echo "::warning::No CSQTTR release asset yet; building from the linked core PR branch"
            rm -f Frontend/ios/Core/libcsqttr_ios_core.a
            git clone --depth 1 --branch feat/csqttr-ci-ios-latest https://github.com/Endlad2/csqttr-core.git /tmp/csqttr-core
            cargo build --manifest-path /tmp/csqttr-core/ios-core/Cargo.toml --release --target x86_64-apple-ios
            cargo build --manifest-path /tmp/csqttr-core/ios-core/Cargo.toml --release --target aarch64-apple-ios
            lipo -create \
              /tmp/csqttr-core/ios-core/target/x86_64-apple-ios/release/libcsqttr_ios_core.a \
              /tmp/csqttr-core/ios-core/target/aarch64-apple-ios/release/libcsqttr_ios_core.a \
              -output Frontend/ios/Core/libcsqttr_ios_core.a
          fi
          ls -la Frontend/ios/Core/libcsqttr_ios_core.a

      - name: Generate Xcode project
        working-directory: Frontend/ios
        run: |
          set -e
          xcodegen generate
          PBX=Runner.xcodeproj/project.pbxproj
          if grep -q 'objectVersion = 77;' "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' "$PBX"
          fi
          grep -q 'TunnelSession.swift' "$PBX" || { echo "::error::TunnelSession.swift NOT in project"; exit 1; }
          grep -q 'TunnelSocks5Server.swift' "$PBX" || { echo "::error::TunnelSocks5Server.swift NOT in project"; exit 1; }
          if grep -q 'PacketTunnelProvider.swift' "$PBX"; then
            echo "::error::NetworkExtension tunnel must not be in the project"
            exit 1
          fi

      - name: Show destinations (diagnostics)
        shell: bash
        working-directory: Frontend/ios
        continue-on-error: true
        run: |
          set -x
          xcodebuild -version
          xcodebuild -project Runner.xcodeproj -list
          xcodebuild -project Runner.xcodeproj -scheme Runner -showdestinations || true
          xcodebuild -project Runner.xcodeproj -scheme Runner -showBuildSettings \
            -sdk iphoneos 2>/dev/null \
            | grep -E 'SUPPORTED_PLATFORMS|SDKROOT|PLATFORM_NAME|SUPPORTS_MAC_DESIGNED' || true

      - name: Build app (unsigned, iphoneos SDK)
        shell: bash
        working-directory: Frontend/ios
        run: |
          set -euo pipefail

          # An iOS app on an Apple-silicon runner is also a valid
          # "Designed for iPad" macOS destination. Whenever xcodebuild resolves
          # the host Mac it fails with
          #   The configuration 'macos-14-arm64-us-default' is not supported
          # so every attempt below pins the iOS platform and disables the Mac
          # candidates.
          COMMON=(
            -project Runner.xcodeproj
            -scheme Runner
            -configuration Release
            -derivedDataPath build/DerivedData
            SUPPORTED_PLATFORMS=iphoneos
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO
            SUPPORTS_MACCATALYST=NO
            ARCHS=arm64
            ONLY_ACTIVE_ARCH=NO
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM=""
          )

          attempt() {
            local label="$1"
            shift
            echo "::group::xcodebuild $label"
            if xcodebuild "$@" 2>&1 | tee "xcodebuild-$label.log"; then
              echo "::endgroup::"
              echo "LALUNE_IOS_ARTIFACT=$label" >> "$GITHUB_ENV"
              return 0
            fi
            echo "::endgroup::"
            # Job logs require admin rights here, so duplicate the tail of the
            # failure as annotations to keep it diagnosable.
            tail -n 40 "xcodebuild-$label.log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::[$label] $line"
            done
            return 1
          }

          # Try the cheapest device build first, then the same build without a
          # destination, then archive. Only the last failure is fatal.
          attempt build-destination \
            build "${COMMON[@]}" -sdk iphoneos -destination 'generic/platform=iOS' \
            || attempt build-sdk \
              build "${COMMON[@]}" -sdk iphoneos \
            || attempt archive \
              archive "${COMMON[@]}" -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                -archivePath build/LaLune.xcarchive \
            || { echo "::error::every xcodebuild attempt failed"; exit 1; }

      - name: Verify the built bundle
        working-directory: Frontend/ios
        run: |
          set -euo pipefail
          APP=""
          for candidate in \
            build/DerivedData/Build/Products/Release-iphoneos/LaLune.app \
            build/DerivedData/Build/Products/Release-iphoneos/Runner.app \
            build/LaLune.xcarchive/Products/Applications/LaLune.app \
            build/LaLune.xcarchive/Products/Applications/Runner.app; do
            if [ -d "$candidate" ]; then APP="$candidate"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "::error::built .app not found; listing products:"
            find build -maxdepth 6 -name '*.app' -print 2>/dev/null || true
            exit 1
          fi
          echo "LALUNE_IOS_APP=$APP" >> "$GITHUB_ENV"
          echo "Using $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          file "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          if [ -d "$APP/Contents" ]; then
            echo "::error::$APP is a macOS bundle, not an iOS one"
            exit 1
          fi

      - name: Package unsigned IPA
        shell: bash
        working-directory: Frontend/ios
        run: |
          set -euo pipefail
          APP="${LALUNE_IOS_APP:?LALUNE_IOS_APP is not set; did the build step run?}"
          [ -d "$APP" ] || { echo "::error::$APP missing"; exit 1; }
          rm -rf build/Payload build/LaLune.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/LaLune.app
          ( cd build && zip -qry LaLune.ipa Payload )
          ls -la build/LaLune.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: Frontend/ios/build/LaLune.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Frontend/ios/build/LaLune.ipa
          fail_on_unmatched_files: true
