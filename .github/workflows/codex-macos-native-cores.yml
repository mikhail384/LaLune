name: Build native macOS cores

on:
  push:
    branches: [codex/lalune-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: Endlad2/csqtt-core
            revision: 181a0d9f162bb8040c255496af0aeb14828e612e
            name: csqtt
          - repository: Endlad2/csqttr-core
            revision: adac48fd380973121254fc2ccbf814f469e6f79b
            name: csqttr
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build and smoke test native core
        working-directory: source/rust-client
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          CORE="target/aarch64-apple-darwin/release/client"
          test -x "$CORE"
          file "$CORE"
          "$CORE" --help > /tmp/core-help.txt
          mkdir -p ../../out
          cp "$CORE" "../../out/${{ matrix.name }}-macos-arm64"
          shasum -a 256 "../../out/${{ matrix.name }}-macos-arm64" > "../../out/${{ matrix.name }}-macos-arm64.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-macos-arm64
          path: out/*
          if-no-files-found: error
