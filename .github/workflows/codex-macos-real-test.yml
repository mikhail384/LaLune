name: LaLune macOS private connection test

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful macOS build run ID
        required: true
        default: '43601991029'

permissions:
  contents: read
  actions: read

jobs:
  real-connection:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LaLune-macOS-test
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: test-package
      - name: Test a private CSQTTR profile and restore routing
        env:
          LALUNE_MACOS_TEST_LINK: ${{ secrets.LALUNE_MACOS_TEST_LINK }}
        run: |
          set -euo pipefail
          test -n "$LALUNE_MACOS_TEST_LINK"
          MOUNT="$RUNNER_TEMP/lalune-mounted"
          TEST_HOME="$RUNNER_TEMP/lalune-private-test-home"
          mkdir -p "$MOUNT" "$TEST_HOME"
          hdiutil attach test-package/LaLune-macOS-Test.dmg -nobrowse -mountpoint "$MOUNT"
          APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          sudo env HOME="$TEST_HOME" "$APP/Contents/Resources/lalune-backend" >/dev/null 2>&1 &
          BACKEND_PID=$!
          cleanup() {
            curl -fsS --max-time 3 -X POST http://127.0.0.1:1062/shutdown >/dev/null 2>&1 || true
            sudo kill "$BACKEND_PID" 2>/dev/null || true
            hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:1062/ping >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          python3 Backend/tests/macos_real.py
