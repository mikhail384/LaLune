name: LaLune Windows VM checks

on:
  push:
    branches: [codex/lalune-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build and test desktop backend
        working-directory: Backend/Desktop
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Frontend/assets | Out-Null
          Copy-Item Assets/* Frontend/assets -Recurse -Force
          Push-Location Frontend
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-tree-shake-icons
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Check backend startup on Windows VM
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'lalune-isolated-appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $backend = (Resolve-Path Backend/Desktop/target/release/lalune-backend.exe).Path
          $process = Start-Process -FilePath $backend -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $ping = Invoke-RestMethod -Uri 'http://127.0.0.1:1062/ping' -TimeoutSec 1
                if ($ping.ok) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Windows backend did not answer /ping' }
            if ($ping.os -ne 'windows') { throw 'Unexpected backend OS' }
            $fixture = @{name='Local fixture'; protocol='CSQTTR'; peer='192.0.2.1:46000'; password='local-test'; hashes='local-test'} | ConvertTo-Json
            $config = Invoke-RestMethod -Uri 'http://127.0.0.1:1062/configs' -Method Post -ContentType 'application/json' -Body $fixture
            if (-not $config.id) { throw 'Could not import fixture configuration' }
            $configs = @(Invoke-RestMethod -Uri 'http://127.0.0.1:1062/configs')
            if (-not ($configs | Where-Object { $_.id -eq $config.id })) { throw 'Fixture configuration missing' }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - name: Package backend and official Wintun
        shell: pwsh
        run: |
          $release = 'Frontend/build/windows/x64/runner/Release'
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive -TimeoutSec 90
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'wintun')
          Copy-Item Backend/Desktop/target/release/lalune-backend.exe "$release/LaLuneManager.exe"
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/bin/amd64/wintun.dll') "$release/wintun.dll"
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/LICENSE.txt') "$release/WINTUN-LICENSE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows-test
          path: |
            Frontend/build/windows/x64/runner/Release/
            Backend/Desktop/target/release/lalune-backend.exe
          if-no-files-found: error
      - name: Exercise Wintun with a local synthetic core
        shell: pwsh
        run: |
          rustc Backend/tests/echo_core.rs -O -o "$env:RUNNER_TEMP/lalune-echo-core.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Backend/tests/windows_tun.py `
            Backend/Desktop/target/release/lalune-backend.exe `
            "$env:RUNNER_TEMP/lalune-echo-core.exe" `
            Frontend/build/windows/x64/runner/Release/wintun.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise process and domain routing engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box-windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') { throw 'sing-box checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'sing-box')
          python Backend/tests/windows_split_engine.py (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/sing-box.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch packaged Windows application
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'lalune-ui-appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $release = 'Frontend/build/windows/x64/runner/Release'
          $runner = Get-ChildItem "$release/*.exe" | Where-Object { $_.Name -ne 'LaLuneManager.exe' } | Select-Object -First 1
          if (-not $runner) { throw 'Flutter runner missing' }
          $process = Start-Process -FilePath $runner.FullName -WorkingDirectory $runner.DirectoryName -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try {
                $ping = Invoke-RestMethod -Uri 'http://127.0.0.1:1062/ping' -TimeoutSec 1
                if ($ping.ok) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            $process.Refresh()
            if ($process.HasExited -or -not $ready) { throw 'Windows application or bundled backend did not start' }
            if (-not (Test-Path "$env:APPDATA/.la-lune/wintun.dll")) { throw 'Bundled Wintun was not installed' }
          } finally {
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:1062/shutdown' -Method Post -TimeoutSec 2 | Out-Null } catch {}
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
