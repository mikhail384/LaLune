# Static LaLune website deployment to GitHub Pages.

name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f Site/index.html
          test -f Site/styles.css
          test -f Site/app.js
          test -f Site/assets/icon.png
          test -f Site/assets/lune.png
          test -f Site/assets/max_qr.jpg
          if grep -RInE 'flutter|dart\.js|main\.dart\.js' Site/index.html Site/styles.css Site/app.js; then
            echo 'Flutter artifacts found in static site source' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
