name: mac-test
# Запускает собранный LaLune-macOS.zip на настоящем Mac (раннер GitHub), делает скриншот и собирает логи.
on:
  workflow_dispatch:

jobs:
  mac-test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Скачать последний релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p t && cd t
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'LaLune-macOS.zip'
          unzip -q LaLune-macOS.zip
          ls -la
          APP=$(ls -d *.app | head -1); echo "APP=$APP" >> "$GITHUB_ENV"
          sw_vers; uname -m
          file "$APP/Contents/MacOS/"*
          ls -la "$APP/Contents/Resources" | head -30
          file "$APP/Contents/Resources/lalune-backend" || true
      - name: Запустить бэкенд напрямую (root) и приложение
        run: |
          cd t
          xattr -cr "$APP" || true
          sudo sh -c "'$PWD/$APP/Contents/Resources/lalune-backend' >/tmp/lalune-backend.log 2>&1 &" || true
          sleep 3
          ( "$PWD/$APP/Contents/MacOS/"* >/tmp/app.log 2>&1 & )
          sleep 20
          curl -s -m 3 http://127.0.0.1:1062/ping > /tmp/ping.txt || echo "ping failed" > /tmp/ping.txt
          screencapture -x /tmp/screen.png || true
          echo "--- ping"; cat /tmp/ping.txt
          echo "--- app.log"; cat /tmp/app.log | tail -80
          echo "--- backend.log"; cat /tmp/lalune-backend.log | tail -80
          ps aux | grep -i lalune | grep -v grep || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i lalune || true
      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: |
            /tmp/screen.png
            /tmp/app.log
            /tmp/lalune-backend.log
            /tmp/ping.txt
            ~/Library/Logs/DiagnosticReports/*lalune*
          if-no-files-found: warn
