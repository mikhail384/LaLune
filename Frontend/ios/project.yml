name: Runner
options:
  bundleIdPrefix: com.lalune
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.9.18"
    CURRENT_PROJECT_VERSION: "9018"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Явно только iPhone/iPad. Без этого iOS-приложение на Apple-silicon
    # раннере считается «Designed for iPad» и xcodebuild выбирает host-Mac
    # как destination, падая на «The configuration 'macos-14-arm64-us-default'
    # is not supported».
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO

targets:

  # ──────────────────────────────────────────────────────────
  #  Основное приложение (Flutter runner)
  # ──────────────────────────────────────────────────────────
  Runner:
    type: application
    platform: iOS
    sources:
      # ВАЖНО: sources: Runner целиком — xcodegen рекурсивно подхватит
      # все .swift / .h / .m / .plist / .storyboard / .xcassets внутри.
      #
      # Канонические исходники бэкенда лежат в Backend/iOS/ и копируются сюда
      # через `sh Frontend/ios/sync-backend.sh` (тот же скрипт вызывает
      # build-ios.yml). В git из Runner-исходников хранятся только
      # AppDelegate.swift и SceneDelegate.swift.
      - path: Runner
        excludes:
          - "Info.plist"
      - path: Entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalune.lalune
        PRODUCT_NAME: LaLune
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/Runner.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        # Только iOS: Mac-вариант («Designed for iPad») даёт xcodebuild
        # destination host-Mac и ошибку про неподдерживаемую конфигурацию.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

        # Каждый плагин с нативным кодом обязан быть и в путях поиска, и в
        # OTHER_LDFLAGS, и в Embed-скрипте: GeneratedPluginRegistrant.m делает
        # `@import <plugin>;`, и пропущенный плагин валит сборку ошибкой
        # «Module '<plugin>' not found». Список совпадает с
        # .flutter-plugins-dependencies → plugins.ios.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Flutter/Release/Flutter.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/Flutter/Release/App.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/Flutter/Release/mobile_scanner.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/Flutter/Release/share_plus.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/Flutter/Release/shared_preferences_foundation.xcframework/ios-arm64"

        # Ядро CSQTT/CSQTTR линкуется прямо в приложение: системного туннеля
        # (NetworkExtension) больше нет, системный VPN поднимает incy, а мы
        # отдаём ему локальный SOCKS5.
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Core"

        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Flutter"
          - "-framework"
          - "App"
          - "-framework"
          - "mobile_scanner"
          - "-framework"
          - "share_plus"
          - "-framework"
          - "shared_preferences_foundation"
          - "-framework"
          - "WebKit"
          - "-framework"
          - "AuthenticationServices"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AudioToolbox"
          - "-lcsqtt_ios_core"
          - "-lcsqttr_ios_core"

        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

    postCompileScripts:
      - name: "Embed Flutter Frameworks"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          FW_DST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$FW_DST"

          for fw in Flutter App mobile_scanner share_plus shared_preferences_foundation; do
            SRC="${SRCROOT}/Flutter/Release/${fw}.xcframework/ios-arm64/${fw}.framework"
            if [ -d "$SRC" ]; then
              rm -rf "$FW_DST/${fw}.framework"
              cp -R "$SRC" "$FW_DST/"
              echo "Embedded: ${fw}.framework"
            else
              echo "WARNING: not found ${SRC}"
            fi
          done

    postBuildScripts:
      - name: "Copy Flutter Assets"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DST"

          SRC="${SRCROOT}/Flutter/Release/App.xcframework/ios-arm64/App.framework/flutter_assets"
          if [ -d "$SRC" ]; then
            rm -rf "$DST/flutter_assets"
            cp -R "$SRC" "$DST/"
            echo "Copied flutter_assets"
          else
            echo "WARNING: flutter_assets not found at $SRC"
            ALT="${SRCROOT}/Flutter/Release/App.xcframework/ios-arm64/flutter_assets"
            if [ -d "$ALT" ]; then
              cp -R "$ALT" "$DST/"
              echo "Copied flutter_assets (fallback)"
            fi
          fi

    # NetworkExtension-расширение больше не используется: системный VPN
    # поднимает incy, LaLune работает как локальный SOCKS5-прокси.

schemes:
  Runner:
    build:
      targets:
        Runner: all
    run:
      config: Debug
    archive:
      config: Release
